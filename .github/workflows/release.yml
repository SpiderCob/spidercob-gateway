name: release
on:
  push:
    tags:
      - 'v*'
  pull_request:
    # A snapshot dry run (no tag, no publish) on any PR touching release
    # config -- the one thing automation/run-e2e-release.sh (make ci)
    # can't cover locally: cosign's keyless signing needs a real,
    # CI-issued OIDC token (id-token: write below), so this is where
    # that half of issue #49's pipeline actually gets proven end to end,
    # before the first real tag is ever pushed.
    paths:
      - '.goreleaser.yml'
      - 'cmd/spidercob/main.go'
      - '.github/workflows/release.yml'
      - 'Dockerfile'
      - 'docker-compose.yml'

env:
  # ghcr.io requires an all-lowercase image path -- the GitHub org login
  # (SpiderCob) is mixed-case, so this is a literal, hardcoded lowercase
  # string rather than derived from github.repository_owner (issue #51).
  IMAGE: ghcr.io/spidercob/spidercob-gateway

jobs:
  release:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write # publish the GitHub Release
      packages: write # publish the container image to GHCR (issue #51)
      id-token: write # cosign keyless signing (Sigstore OIDC)
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # goreleaser needs full history for its changelog
      - uses: actions/setup-go@v5
        with:
          # Matches go.mod's `go 1.25.0` directive exactly -- ci.yml
          # (the main PR/push workflow) still pins 1.22, a real,
          # pre-existing gap (Copilot's review on PR #50 flagged the
          # divergence this creates: tagged release artifacts built with
          # a different toolchain than what PRs are validated against).
          # Already identified and deliberately left out of scope for
          # issue #49 -- see that spec's Out of Scope section: fixing
          # ci.yml is a separate, unrelated change with its own blast
          # radius, not bundled into a release-engineering PR. This
          # workflow itself is correct (matches go.mod); ci.yml is the
          # one that's stale.
          go-version: '1.25'
      # Deliberately NOT pinning cosign-release here: the action's own
      # default (verified against this repo directly -- v3.0.6, at time
      # of writing) is the version its own install-verification logic is
      # actually tested against. Explicitly requesting a newer version
      # (v3.1.3, what's on this machine via Homebrew) failed in CI with a
      # 404 fetching a detached .sig file cosign's own release process no
      # longer publishes for that tag -- a real, confirmed incompatibility
      # between the installer action's custom-version code path and
      # cosign's current release asset layout, not a hypothetical. Both
      # v3.0.6 and v3.1.3 support sign-blob --bundle (confirmed locally
      # against both real binaries), which is all .goreleaser.yml's
      # signs: config needs -- so the installer's own default is both
      # safer and sufficient.
      - uses: sigstore/cosign-installer@v3
      # HOMEBREW_TAP_GITHUB_TOKEN doesn't exist until the tap repo/secret
      # setup described in .goreleaser.yml's brews: comment is done
      # (a manual, one-time, org-level prerequisite) -- without this
      # guard, goreleaser's brews publish step fails outright when the
      # token is absent, which fails this whole job and marks the first
      # real tag's release red for a reason that has nothing to do with
      # whether the binaries/checksums/signatures themselves are good.
      # Every other target (GitHub Release, binaries, checksums, cosign
      # signatures) still publishes -- only Homebrew is conditionally
      # skipped. Flagged by Copilot's review on PR #50.
      - name: determine goreleaser args
        id: gr-args
        run: |
          if [ -n "${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}" ]; then
            echo "args=release --clean" >>"$GITHUB_OUTPUT"
          else
            echo "args=release --clean --skip=homebrew" >>"$GITHUB_OUTPUT"
            echo "::warning::HOMEBREW_TAP_GITHUB_TOKEN is not set -- skipping the Homebrew formula publish for this release. See .goreleaser.yml's brews: comment for the one-time tap-repo setup this needs."
          fi
      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: '~> v2'
          args: ${{ steps.gr-args.outputs.args }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}

      # Container image (issue #51) -- the deliberately-deferred half of
      # #39's Docker packaging work, now closed out. Reuses the existing,
      # already-tested Dockerfile completely unchanged (run-e2e-docker.sh
      # still owns proving the image itself is correct); this only adds
      # where the already-correct image gets published. A plain
      # docker/build-push-action step, not goreleaser's native dockers:
      # mechanism -- confirmed with the user: that mechanism expects a
      # thin Dockerfile that copies in an already-built binary, not one
      # doing its own full multi-stage build from source the way this
      # one does.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: build and push container image
        id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.ref_name }}
            ${{ env.IMAGE }}:latest
      # cosign sign (the OCI-image-signing sibling of .goreleaser.yml's
      # sign-blob on the binary checksums) -- signs the resolved digest,
      # not a mutable tag, so the signature can never be silently
      # invalidated by a later push retagging `latest`. Same GitHub
      # Actions OIDC identity already used for the binaries -- no new
      # trust mechanism, no key to custody.
      - name: cosign sign the pushed image
        run: cosign sign --yes "${{ env.IMAGE }}@${{ steps.image.outputs.digest }}"

  snapshot-check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # cosign keyless signing -- the real point of this job
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
      - uses: sigstore/cosign-installer@v3 # see the release job's comment above -- deliberately using the action's own tested default version
      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: '~> v2'
          # --skip=publish,homebrew: never touches GitHub Releases or the
          # tap repo from a PR. Signing is deliberately NOT skipped --
          # proving that step works for real is this job's entire reason
          # to exist (automation/run-e2e-release.sh already covers
          # everything else locally, Docker-free, in make ci).
          args: release --snapshot --clean --skip=publish,homebrew

  # Real, disposable push/pull/sign/verify round trip against the real
  # registry (issue #51) -- the container-image equivalent of
  # snapshot-check above. run-e2e-docker.sh (make ci-docker) already
  # proves the image itself is correct; the one thing that can't be
  # dry-run locally is the actual push/pull/sign/verify chain against
  # ghcr.io, which needs real package-write credentials and a real OIDC
  # token. Pushes to a PR-scoped, disposable tag -- never touches
  # `latest` or any real version tag -- and deletes that tag's package
  # version afterward (always, even on failure) so no test clutter is
  # left behind in the registry.
  docker-image-check:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # push the disposable test tag, and delete it afterward
      id-token: write # cosign keyless signing
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: sigstore/cosign-installer@v3
      - name: compute a disposable, unique test tag
        id: tag
        run: echo "tag=pr-${{ github.event.pull_request.number }}-${{ github.run_id }}" >>"$GITHUB_OUTPUT"
      - name: build and push a real, disposable test image
        id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE }}:${{ steps.tag.outputs.tag }}
      - name: pull it back down -- proves it's actually retrievable, not just that push exited 0
        run: docker pull "${{ env.IMAGE }}:${{ steps.tag.outputs.tag }}"
      - name: sign the pushed digest for real
        run: cosign sign --yes "${{ env.IMAGE }}@${{ steps.image.outputs.digest }}"
      - name: verify that signature for real -- the exact command docs/verify-release.md documents
        run: |
          cosign verify "${{ env.IMAGE }}@${{ steps.image.outputs.digest }}" \
            --certificate-identity-regexp "^https://github\.com/SpiderCob/spidercob-gateway/" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com
      - name: clean up -- delete the disposable test tag's package version
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version_id=$(gh api "/orgs/SpiderCob/packages/container/spidercob-gateway/versions" --paginate \
            --jq ".[] | select(.metadata.container.tags[]? == \"${{ steps.tag.outputs.tag }}\") | .id" | head -1)
          if [ -n "$version_id" ]; then
            gh api -X DELETE "/orgs/SpiderCob/packages/container/spidercob-gateway/versions/$version_id"
          else
            echo "no package version found for tag ${{ steps.tag.outputs.tag }} -- nothing to clean up (push likely never succeeded)"
          fi
